name: Markdown to PDF
description: Convert the repository's root README.md (with images/figures) to a styled PDF using WeasyPrint.
branding:
  icon: file-text
  color: blue

inputs:
  output-dir:
    description: Directory for the PDF. "." writes README.pdf in the repo root.
    default: pdf
  page-size:
    description: CSS page size, e.g. A4, Letter, "A4 landscape".
    default: A4
  font-size:
    description: Base font size in pt.
    default: "11"
  number-figures:
    description: Prefix figure captions with "Figure N.".
    default: "true"
  css:
    description: Optional path to an extra CSS file.
    default: ""
  upload-artifact:
    description: Upload README.pdf as a workflow artifact.
    default: "true"
  artifact-name:
    description: Name of the uploaded artifact.
    default: pdfs

outputs:
  output-dir:
    description: Directory containing the generated PDFs.
    value: ${{ inputs.output-dir }}

runs:
  using: composite
  steps:
    - name: Install system libraries
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends $(cat "$GITHUB_ACTION_PATH/packages.txt")

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install markdown2pdf
      shell: bash
      run: pip install --quiet "$GITHUB_ACTION_PATH"

    - name: Convert markdown to PDF
      shell: bash
      env:
        OUTPUT_DIR: ${{ inputs.output-dir }}
        PAGE_SIZE: ${{ inputs.page-size }}
        FONT_SIZE: ${{ inputs.font-size }}
        NUMBER_FIGURES: ${{ inputs.number-figures }}
        CSS: ${{ inputs.css }}
      run: |
        args=(--output "$OUTPUT_DIR/README.pdf" --page-size "$PAGE_SIZE" --font-size "$FONT_SIZE")
        [[ -n "$CSS" ]] && args+=(--css "$CSS")
        [[ "$NUMBER_FIGURES" == "false" ]] && args+=(--no-figure-numbers)
        readme=$(find . -maxdepth 1 -type f -iname readme.md | head -n 1)
        if [[ -z "$readme" ]]; then
          echo "::error::README.md not found in the repository root"
          exit 1
        fi
        markdown2pdf "${readme#./}" "${args[@]}"

    - name: Upload PDF
      if: inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.output-dir }}/README.pdf
        if-no-files-found: error
